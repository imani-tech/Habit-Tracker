<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
       
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/b9cfd8d025.js" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<body>
    <div class="whole-page">
       
    <div class="header"> 
        <img src="public-domain-vectors-uBbB-8RHNbU-unsplash-removebg-preview.png" alt="image" width="50px">   
    <h1>Habit Tracker</h1>      
    </div>
    <div class="below">
    <div class="quotes">        
        <img src="denny-sammuel-ngosYYAzZy0-unsplash-removebg-preview.png" alt="image" width="40px">
        <p>Successfull people are simply those with successfull habits</p>
         </div>
         <div class="habit-section">
    <label for="habit-input"></label>
    <p class="text">Add habit</p>
    <div class="habit-inputs">
    <input type="text" id="habit-input" placeholder="eg cook">
    <p id="error"></p>
    <select name="category" id="category">
        <option value="">Select a category</option>
        <option value="health">Health</option>
        <option value="productivity">Productivity</option>
        <option value="learning">Learning</option>
        <option value="leisure">Leisure</option>
        <option value="personal">Personal</option>
    </select>    
    <button type="button" id="save-habit">Save</button>
    </div>
    </div>
     <h3>My Habits</h3>  
     <div class="wrapper">  
       <p>
        <i class="fa-regular fa-calendar"></i>
        <span id="today-date"></span>
    </p> 
    <div class="habit-info-wrapper">
        
        <div class="habits-info-second-wrapper ">
     <img src="vecteezy_vector-target-illustration-on-white-background_27202016-removebg-preview.png" alt="arrow" width="40px">
          <div class="habit-info ">
             <p id="totalHabitsText" class="remove-margin">0</p>
             <p class="total-text remove-margin">Total Habits</p>
           </div>
     </div>
     
     <div class="habits-info-second-wrapper small-style">
     <img src="vecteezy_trophy-icon-medal-icon-winner-illustration-logo-simple_36107340-removebg-preview.png" alt="" width="40px">
     <div class="habit-info ">        
     <p id="totalHabitsCompletedText" class="remove-margin">0</p>
     <p class="total-text remove-margin">Completed</p>
    </div> 
</div>

     </div> 
     </div>    
     <section id="display-habit">            
     </section>  
     <div class="dashboard">
    <p>Total Habits: 
        <span >0</span>
    </p>
    <p>Habits Completed Today: 
        <span id="HabitscompletedTodayText">0</span>
    </p>
    <p>Total Completions: 
        <span >0</span>
    </p>
</div> 
</div>
</div>
    <script src="script.js"></script>


</body>
</html>
